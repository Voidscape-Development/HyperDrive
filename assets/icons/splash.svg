<svg xmlns="http://www.w3.org/2000/svg" width="540" height="220" viewBox="0 0 540 220">
  <title>HyperDrive splash screen</title>
  <!-- Rendered to splash.png at 2x. Fonts are Saira (SIL OFL), from layout/fonts -->
  <style>
    @font-face { font-family: "Saira HD Condensed"; font-weight: 800; font-style: italic;
      src: url("../../layout/fonts/Saira/Saira_Condensed-ExtraBoldItalic.ttf"); }
    @font-face { font-family: "Saira HD"; font-weight: 500;
      src: url("../../layout/fonts/Saira/Saira-Medium.ttf"); }
    .word { font-family: "Saira HD Condensed"; font-weight: 800; font-style: italic; font-size: 54px; letter-spacing: 1px; }
    .tag { font-family: "Saira HD"; font-weight: 500; font-size: 10px; letter-spacing: 0.4px; }
  </style>

  <rect width="540" height="220" fill="#111214"/>

  <!-- Mark, with two faint chevrons trailing behind it -->
  <svg x="-17.5" y="67.5" width="189" height="85" viewBox="-102 56 320 144">
    <g transform="translate(-10 0)">
      <path d="M-84 64 H-40 L10 128 L-40 192 H-84 L-34 128 Z" fill="#1A1B1F"/>
      <path d="M-14 64 H30 L80 128 L30 192 H-14 L36 128 Z" fill="#26272C"/>
      <path d="M56 64 H100 L150 128 L100 192 H56 L106 128 Z" fill="#F4F4F2"/>
      <path d="M126 64 H170 L220 128 L170 192 H126 L176 128 Z" fill="#FFB800"/>
    </g>
  </svg>

  <text x="200" y="122" class="word" fill="#F4F4F2">HYPERDRIVE</text>
  <text x="201" y="141" class="tag" fill="#9A9BA3">Stream helper for fighting game tournaments</text>

  <rect y="218" width="540" height="2" fill="#FFB800"/>
</svg>
