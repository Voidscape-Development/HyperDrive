<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body class="inset">
    <div class="hud">
      <div class="pill"><div class="tournament_name"></div></div>

      <div class="bar">
        <div class="accent"><div class="p1"></div><div class="p2"></div></div>

        <div class="p1 player">
          <div class="name_block">
            <div class="name"></div>
            <div class="extra">
              <div class="location"></div>
              <div class="rotating"></div>
            </div>
          </div>
          <div class="character_container"></div>
          <div class="score"></div>
        </div>

        <div class="center">
          <div class="logo"></div>
          <div class="clock"></div>
        </div>

        <div class="p2 player">
          <div class="name_block">
            <div class="name"></div>
            <div class="extra">
              <div class="location"></div>
              <div class="rotating"></div>
            </div>
          </div>
          <div class="character_container"></div>
          <div class="score"></div>
        </div>
      </div>

      <div class="subbar">
        <div class="phase"></div>
        <div class="match"></div>
        <div class="best_of"></div>
      </div>
    </div>

    <script>
      HD.page({ info_layout: "center" });
    </script>
    <script src="index.js"></script>
  </body>
</html>
