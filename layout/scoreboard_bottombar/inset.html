<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body class="inset">
    <div class="bar">
      <div class="accent"><div class="p1"></div><div class="p2"></div></div>

      <div class="info">
        <div class="logo"></div>
        <div class="info_text">
          <div class="tournament_name"></div>
          <div class="phase"></div>
          <div class="match"></div>
        </div>
      </div>

      <div class="p1 player">
        <div class="name_block">
          <div class="name"></div>
          <div class="extra">
            <div class="location"></div>
            <div class="rotating"></div>
          </div>
        </div>
        <div class="score"></div>
      </div>

      <div class="center">
        <div class="p1 character_container"></div>
        <div class="vs">VS</div>
        <div class="p2 character_container"></div>
      </div>

      <div class="p2 player">
        <div class="name_block">
          <div class="name"></div>
          <div class="extra">
            <div class="location"></div>
            <div class="rotating"></div>
          </div>
        </div>
        <div class="score"></div>
      </div>

      <div class="clock">
        <div class="time"></div>
        <div class="zone"></div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
