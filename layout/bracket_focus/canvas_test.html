<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="../include/bracket.css" />
    <link rel="stylesheet" href="./index.css" />
    <style>
      /* A proof page (see canvas_test.js): the bracket on one canvas */
      .bf_canvas {
        position: absolute;
        left: 0;
        top: 0;
      }

      /* The sets as the browser draws them, off screen, to be photographed */
      .stage {
        position: absolute;
        left: -100000px;
        top: 0;
      }

      .hud {
        display: none;
        position: absolute;
        left: 8px;
        bottom: 4px;
        font: 14px monospace;
        letter-spacing: 0;
        color: #fff;
        background: rgba(0, 0, 0, 0.7);
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <div class="title">
      <div class="container">
        <div class="logo"></div>
        <div class="col">
          <div class="tournament_name"></div>
          <div class="event_name"></div>
        </div>
        <div class="col">
          <div class="bracket_name"></div>
          <div class="pool_name"></div>
        </div>
      </div>
    </div>
    <div class="viewport">
      <canvas class="bf_canvas"></canvas>
    </div>
    <div class="stage"></div>
    <div class="focus_label"><div class="container"><div class="label"></div></div></div>
    <div class="hud"></div>
    <script src="../include/bracket.js"></script>
    <script src="canvas_test.js"></script>
  </body>
</html>
