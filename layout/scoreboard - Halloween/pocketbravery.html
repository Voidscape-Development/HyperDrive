<html>
  <head>
    <meta charset="utf-8" />
    <script src="../include/globals.js"></script>
    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="./halloween.css" />
  </head>
  <body class="halloween fgc pbrave">
    <script>if (window.parent !== window) { document.addEventListener('DOMContentLoaded', () => { document.querySelectorAll('.hw_plaque').forEach((e) => e.style.display = 'none'); }); }</script>

    <div class="anim_container_outer">
      <div class="anim_container_inner">
        <div class="hw_plaque fade_down">
          <div class="tournament_name"></div>
        </div>

        <div class="hw_caption fade_up">
          <div class="match"></div>
          <div class="phase"></div>
        </div>

        <div class="p1 player container fade_right">
          <div class="icon avatar"></div>
          <div class="icon online_avatar"></div>
          <div class="flagcountry"></div>
          <div class="flagstate"></div>
          <div class="sponsor_icon"></div>
          <div class="name_twitter">
            <div class="name"></div>
            <div class="extra">
              <div class="pronoun"></div>
              <div class="twitter"></div>
            </div>
          </div>
          <div class="score"></div>
        </div>
        <div class="p2 player container fade_left">
          <div class="icon avatar"></div>
          <div class="icon online_avatar"></div>
          <div class="flagcountry"></div>
          <div class="flagstate"></div>
          <div class="sponsor_icon"></div>
          <div class="name_twitter">
            <div class="name"></div>
            <div class="extra">
              <div class="pronoun"></div>
              <div class="twitter"></div>
            </div>
          </div>
          <div class="score"></div>
        </div>

      </div>
    </div>

    <script src="../include/scoreboard.js"></script>
    <script src="index.js"></script>
  </body>
</html>
