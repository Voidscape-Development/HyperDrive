<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Team battle score</title>
		<script src="sdpi-components.js"></script>
		<script src="locales.js"></script>
		<script src="common.js"></script>
	</head>
	<body>
		<sdpi-item label="__MSG_team__">
			<sdpi-radio setting="team" default="1">
				<option value="1">__MSG_team1__</option>
				<option value="2">__MSG_team2__</option>
			</sdpi-radio>
		</sdpi-item>
		<sdpi-item label="__MSG_scoreType__">
			<sdpi-select setting="direction" default="up">
				<option value="up">__MSG_addPoint__</option>
				<option value="down">__MSG_removePoint__</option>
			</sdpi-select>
		</sdpi-item>
		<p class="hd-hint" data-msg="battleScoreHint"></p>
		<p class="hd-hint" data-msg="dialBattle"></p>
	</body>
</html>
