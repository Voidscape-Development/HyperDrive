<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Load set</title>
		<script src="sdpi-components.js"></script>
		<script src="locales.js"></script>
		<script src="common.js"></script>
	</head>
	<body>
		<sdpi-item label="__MSG_scoreboard__">
			<sdpi-select setting="scoreboard" datasource="scoreboards" hot-reload default="1"></sdpi-select>
		</sdpi-item>
		<sdpi-item label="__MSG_load__">
			<sdpi-select setting="source" default="queue">
				<option value="queue">__MSG_loadQueue__</option>
				<option value="stream">__MSG_loadStream__</option>
				<option value="selector">__MSG_loadSelector__</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
