name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Qt needs these even without a display (QT_QPA_PLATFORM=offscreen)
      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: uv sync --frozen

      # Each test is a script that exits non-zero when a check fails. They all
      # run, so one failure doesn't hide another.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          failed=0
          for test in test/test_*.py; do
            # Draws eyesight markers on downloaded game assets, to be checked
            # by eye: it has nothing to assert, and the assets aren't here
            if [ "$test" = test/test_eyesights.py ]; then continue; fi
            echo "::group::$test"
            if ! timeout 600 uv run --no-sync python "$test"; then
              echo "::error file=$test::$test failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
