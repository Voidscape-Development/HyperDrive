name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Only ruff is needed, not the application's dependencies
      - name: Install ruff
        run: uv sync --frozen --only-group dev

      - name: Lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

  layouts:
    name: Layouts (ESLint, Prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: layout
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The configs are in layout/ (eslint.config.mjs, .prettierrc.json)
      - name: Install tools
        run: npm install --no-save --no-audit --no-fund eslint@10.1.0 @eslint/js@10 prettier@3.8.1

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check .
